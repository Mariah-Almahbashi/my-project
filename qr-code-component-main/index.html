<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    body {
      background-color: hsl(212, 45%, 89%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .outer-card {
      width: 16rem;
      height: 24rem;
      background-color: white;
      border-radius: 18px;
      text-align: center;

    }

    body {
      background-color: hsl(212, 45%, 89%);
      min-height: 100vh;
      margin: 0;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .outer-card {
      width: 16rem;
      height: 24rem;
      background-color: white;
      border-radius: 18px;
      text-align: center;
    }

    #baracode {
      width: 14rem;
      margin-top: 15px;
      border-radius: 10px;
    }

    h4 {
      font-family: Outfit;
      font-weight: 700;
      font-size: 15px;
      margin: 15px 25px 0px;
    }

    p {
      font-family: Outfit;
      font-weight: 400;
      font-size: 12px;
      padding: 0px 20px;
      color: hsl(216, 15%, 48%);
    }
  </style>
</head>

<body>

  <div class="outer-card">
    <img src="images/image-qr-code.png" alt="baracode" id="baracode">

    <h4> Improve your front-end <br>skills by building projects </h4>
    <p> scan the QR code to visit Frontend Mentor and take your coding skills to<br> the next level </p>

  </div>
  <br>
</body>

</html>
